<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Faculty Login | AI & Data Science Forum</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

min-height: 100vh;
margin: 0;

background:
radial-gradient(circle at top left,#3B82F6 0%,transparent 35%),
radial-gradient(circle at bottom right,#7C3AED 0%,transparent 35%),
linear-gradient(135deg,#050816,#0F172A,#111827);
position:relative;
background-size:400% 400%;

animation:bgMove 10s infinite alternate;

overflow:hidden;

}

@keyframes bgMove{

0%{background-position:left;}

100%{background-position:right;}

}

.login-box{
transform:translateX(35px);
margin:auto;
left:10px;
position:relative;
z-index:10;
width:420px;
padding:45px;
border-radius:28px;

background:rgba(15,23,42,.75);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.15);

box-shadow:
0 0 30px rgba(59,130,246,.35),
0 0 60px rgba(124,58,237,.18);

transition:.4s;
margin:auto;
}

.login-box:hover{
transform:translateY(-6px);
box-shadow:
0 0 45px rgba(59,130,246,.55),
0 0 90px rgba(124,58,237,.35);
}

h1{

    color:#ffffff;
    text-align:center;
    font-size:42px;
    font-weight:700;
    text-shadow:0 0 15px rgba(59,130,246,.8);
    margin-bottom:10px;
}

p{
    color:#dbeafe;
    text-align:center;
}


.subtitle{

margin-bottom:35px;

color:#CBD5E1;

}

input{

width:100%;

padding:16px;

margin:12px 0;

border:none;

border-radius:12px;

font-size:16px;

}

button{

width:100%;

padding:16px;

margin-top:20px;

border:none;

border-radius:12px;

background:linear-gradient(135deg,#2563EB,#7C3AED);

color:white;

font-size:17px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:translateY(-4px);

}
.bg-circle{
position:absolute;
border-radius:50%;
filter:blur(80px);
opacity:.45;
animation:float 8s ease-in-out infinite;
}

.c1{
width:300px;
height:300px;
background:#3B82F6;
top:-80px;
left:-80px;
}

.c2{
width:250px;
height:250px;
background:#7C3AED;
right:-70px;
bottom:-70px;
animation-delay:2s;
}

.c3{
width:180px;
height:180px;
background:#06B6D4;
top:45%;
left:15%;
animation-delay:4s;
}

@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-30px);}
100%{transform:translateY(0px);}
}

.login-box{
    
position:relative;
z-index:10;
}
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;

background-image:
linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);

background-size:40px 40px;

animation:gridMove 10s linear infinite;

pointer-events:none;
}

@keyframes gridMove{
from{
transform:translateY(0);
}
to{
transform:translateY(40px);
}
}
</style>

</head>

<body>

<div class="bg-circle c1"></div>
<div class="bg-circle c2"></div>
<div class="bg-circle c3"></div>

<div class="login-box">

<h1>🤖 AI & Data Science Forum</h1>

<p style="font-size:18px;color:#cbd5e1;">
Secure Faculty Authentication
</p>

<p class="subtitle">

Faculty Login Portal

</p>

<input type="text" id="username" placeholder="Username" onkeypress="enterLogin(event)">

<input type="password" id="password" placeholder="Password" onkeypress="enterLogin(event)">

<button onclick="login()">

Faculty Login

</button>

</div>

<script>

function login(){

let user=document.getElementById("username").value;

let pass=document.getElementById("password").value;

if(user==="admin" && pass==="1234"){

window.location="dashboard.html";

}

else{

alert("Invalid Username or Password");

}

}
function enterLogin(event){
    if(event.key === "Enter"){
        login();
    }
}

</script>

</body>

</html>
