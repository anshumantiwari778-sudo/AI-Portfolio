<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI & DS Forum Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#2563EB,#7C3AED);
}

.login-box{
width:350px;
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
text-align:center;
}

h1{
margin-bottom:25px;
color:#2563EB;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:#2563EB;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1D4ED8;
}

p{
margin-top:15px;
font-size:14px;
}

a{
color:#7C3AED;
text-decoration:none;
}
</style>

</head>
<body>

<div class="login-box">
<h1>AI & DS Forum</h1>

<input type="text" placeholder="Username">

<input type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p><a href="#">Forgot Password?</a></p>

<p>New Student? <a href="#">Register</a></p>

</div>
<script>
function login() {

    let username = document.querySelector('input[type="text"]').value;
    let password = document.querySelector('input[type="password"]').value;

    if(username === "student" && password === "12345"){
        alert("Login Successful!");
        window.location.href = "dashboard.html";
    }
    else{
        alert("Invalid Username or Password");
    }

}
</script>

</body>
</html>
